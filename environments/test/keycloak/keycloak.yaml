apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak

metadata:
  name: keycloak

spec:
  instances: 1
  image: quay.io/keycloak/keycloak:26.7.3
  startOptimized: false

  db:
    vendor: postgres
    host: eduhamuy-pg-devtest.postgres.database.azure.com
    port: 5432
    database: keycloak_test
    poolInitialSize: 1
    poolMinSize: 1
    poolMaxSize: 10
    usernameSecret:
      name: keycloak-db
      key: username
    passwordSecret:
      name: keycloak-db
      key: password

  http:
    httpEnabled: true

  hostname:
    hostname: https://keycloak-test.eduhamuy.com
    strict: true

  proxy:
    headers: xforwarded

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi
