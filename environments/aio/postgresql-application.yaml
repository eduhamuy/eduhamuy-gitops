apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-aio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:eduhamuy/eduhamuy-gitops.git
    targetRevision: main
    path: environments/aio/postgresql
  destination:
    server: https://kubernetes.default.svc
    namespace: eduhamuy-data-aio
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
