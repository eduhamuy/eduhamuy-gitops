apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eduhamuy-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:eduhamuy/eduhamuy-gitops.git
    targetRevision: main
    path: infrastructure/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: eduhamuy-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
